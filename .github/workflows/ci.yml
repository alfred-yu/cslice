name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 版本发布完全手动：GitHub 仓库 → Actions → CI → Run workflow（可选分支或 tag）。
  # 触发后依次跑测试门禁 → 三平台构建 → 发布 PyPI（Trusted Publisher / OIDC）。
  # 平时 push/PR 只跑测试，不会发布任何东西。
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin pytest
      - run: maturin build --out dist
      - run: pip install cslice --find-links dist --force-reinstall
      - run: pytest -v

  # 仅手动触发（workflow_dispatch）时构建三平台 wheel；构建与上传分离——
  # 只有单一 publish job 上传，避免矩阵 job 并发上传在首次发布时竞争
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [rust-test, python-test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  # 统一发布：sdist + 三平台 wheel 一次性上传（Trusted Publisher / OIDC）
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 幂等重跑：已存在的同名文件跳过（发布 run 中途失败重发时避免撞车）
          skip-existing: true
