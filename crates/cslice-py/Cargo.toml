[package]
name = "cslice-py"
version = "0.1.5"
description = "cslice Python 扩展模块（PyO3 绑定，maturin 构建）"
edition = "2021"
license = "MIT"

[lib]
name = "cslice_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
cslice-core = { path = "../cslice-core" }
cslice-draft = { path = "../cslice-draft" }
